# Speaking page content for samdw.org/speaking
#
# How to fill this in:
# - Add one entry under `talks:` per talk. Copy the template at the bottom.
# - If you gave the same talk at several events, keep one entry and list each
#   event under `deliveries:`. If you give it at different lengths, keep one
#   entry and set `length:` on each delivery.
# - `topics:` and `audience:` on each talk must use ids from the `topics:` and
#   `audiences:` lists below. A talk can have as many as fit. These power the
#   filters.
# - Leave optional fields blank ("") or delete them. Required fields are marked.

page:
  heading: "Speaking"
  intro: >-
    I talk about how we make agreements, build, learn, and navigate mistakes
    in relationships, teams, and organizations.
  booking_note: >-
    Booking talks, workshops, and panels for conferences, companies, and
    community organizations.
  booking_url: "contact.html"
  headshot: "img/productcamp2025.jpg"   # path in img/
  speaker_bio_short: ""   # 1–2 sentences organizers can paste into a program
  speaker_bio_long: ""    # one paragraph for event pages

# "Who's it for?" filter chips, sorted by number of talks (most first; ties
# keep this order). Audiences with no talks are hidden.
audiences:
  - id: product
    label: "Product managers"
  - id: ux
    label: "UX researchers"
  - id: leaders
    label: "Leaders"
  - id: educators
    label: "Educators"
  - id: students
    label: "Students"
  - id: community
    label: "Community"
  - id: speakers
    label: "Aspiring speakers"

# Topic filter chips, sorted by number of talks (most first; ties keep this
# order). Topics with no talks are hidden.
# Edit labels freely; keep ids lowercase-with-dashes.
topics:
  - id: trauma
    label: "Trauma"
  - id: consent
    label: "Consent"
  - id: somatics
    label: "Somatics"
