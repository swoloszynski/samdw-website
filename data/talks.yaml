  - id: research
    label: "UX Research"
  - id: facilitation
    label: "Facilitation"
  - id: ai
    label: "AI"
  - id: stakeholders
    label: "Stakeholders & org dynamics"
  - id: strategy
    label: "Product strategy"
  - id: collaboration
    label: "Collaboration & teamwork"
  - id: art
    label: "Art"

